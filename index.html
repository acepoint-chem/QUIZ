<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE POINT Chemistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#00427a; --navy2:#003563; --blue:#00427a; --sky:#e6eef7; --gold:#ffffff; --ink:#1b2333; --muted:#5b6578;
  --green:#16834a; --greenbg:#e3f5ea; --red:#c0392b; --redbg:#fdeaea; --amber:#b9770e; --amberbg:#fff4dc;
  --card:#fff; --bg:#f3f6fb; --line:#d9e1ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
.logo{cursor:pointer;display:flex;align-items:center;gap:10px}
.logo img{height:52px;display:block}
.logo small{font-size:11px;font-weight:600;letter-spacing:2px;opacity:.85;border-left:1px solid rgba(255,255,255,.4);padding-left:10px}
.hdr-right{display:flex;align-items:center;gap:8px;font-size:14px}
.hdr-right button{background:rgba(255,255,255,.12);color:#fff;padding:6px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 6px rgba(20,40,75,.05);margin-bottom:14px}
h1{font-size:23px;margin:0 0 6px;font-weight:800;color:var(--navy)} h2{font-size:18px;margin:16px 0 8px;font-weight:700;color:var(--navy)} h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0} .muted{color:var(--muted);font-size:14px} .small{font-size:13px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--blue);border-color:transparent}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:4px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{background:var(--blue);color:#fff;padding:13px 22px;font-weight:700;font-size:16px;border-radius:999px}
.btn.block{width:100%;margin-top:14px}
.btn:disabled{background:#9db3d8;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.gold{background:#fff;color:var(--navy);font-weight:700}
.link{background:none;color:var(--blue);padding:0;font-weight:600;font-size:14px}
.back{background:none;color:var(--blue);padding:0 0 10px;font-weight:600;font-size:14px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:30px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-60px;width:260px;height:260px;border:1.5px solid rgba(255,255,255,.25);border-radius:50%}
.hero h1{font-size:30px;line-height:1.15;font-weight:800;color:#fff;margin:0 0 10px}
.hero p{opacity:.92}
.hero .byline{display:inline-block;background:#fff;color:var(--navy);font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px;margin:6px 0 14px}
.checks{display:grid;gap:10px;margin-bottom:14px}
.checks div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--navy);font-weight:700;font-size:15px;display:flex;gap:12px;align-items:center}
.checks div::before{content:"✓";font-size:18px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.feat b{display:block;font-size:15px;margin-bottom:2px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;height:5px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--blue)}
.note{background:var(--amberbg);color:#6b4a07;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;width:100%;color:var(--ink);display:block}
.tile:hover:not(:disabled){border-color:var(--blue)}
.tile:disabled{opacity:.6;cursor:not-allowed}
.tile .t{font-weight:700;font-size:16px}
.tile .d{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge.live{background:var(--greenbg);color:var(--green)} .badge.soon{background:#eceff4;color:var(--muted)} .badge.own{background:var(--sky);color:var(--blue)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.tabs button{background:#fff;border:1px solid var(--line);padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--green)}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sky);color:var(--blue)}
.pill.easy{background:var(--greenbg);color:var(--green)} .pill.medium{background:var(--amberbg);color:var(--amber)} .pill.hard{background:var(--redbg);color:var(--red)} .pill.warn{background:var(--redbg);color:var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.timer{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.timer>div{height:100%;background:var(--blue);width:100%;transition:width 1s linear}
.timer.low>div{background:var(--red)}
.qtext{font-size:18px;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;background:#fff;border:2px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt b{display:inline-block;width:24px;color:var(--blue)}
.opt.correct{border-color:var(--green);background:var(--greenbg)} .opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:14px;border-radius:10px;font-size:15px}
.feedback.good{background:var(--greenbg)} .feedback.bad{background:var(--redbg)}
.feedback h3{margin:0 0 6px}
.feedback .mist{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15)}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.quizmode{-webkit-user-select:none;user-select:none}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:40px;font-weight:800;color:var(--navy)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--greenbg);color:var(--green)} .tag.weak{background:var(--redbg);color:var(--red)} .tag.mid{background:var(--amberbg);color:var(--amber)} .tag.na{background:#eceff4;color:var(--muted)}
.review{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;font-size:15px}
.review .q{font-weight:600;margin-bottom:6px}
.price{font-size:30px;font-weight:800;color:var(--navy)}
.price s{font-size:18px;color:var(--muted);font-weight:500;margin-left:6px}
.otp{letter-spacing:10px;text-align:center;font-size:22px;font-weight:700}
#cheer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,40,75,.35);z-index:50}
#cheer.show{display:flex}
#cheer .box{background:#fff;border-radius:18px;padding:22px 28px;text-align:center;animation:pop .35s ease-out;max-width:300px}
#cheer .emo{font-size:64px;line-height:1}
#cheer .msg{font-size:20px;font-weight:800;margin-top:8px;color:var(--navy)}
#cheer .sm{font-size:14px;color:var(--muted);margin-top:4px}
#cheer .tap{font-size:12px;color:#9aa3b2;margin-top:12px}
@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:51;animation:fall 1.8s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(120,20,20,.55);z-index:60;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:380px;text-align:center}
.modal h3{color:var(--red);margin:0 0 8px;font-size:18px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;display:none}
.toast.show{display:block}
footer{text-align:center;font-size:12px;color:var(--muted);padding:14px}
footer button{background:none;color:var(--muted);text-decoration:underline;font-size:12px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--sky);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
</style>
</head>

/* =====================================================================
   2. STORAGE  (swap this block for Firebase later; nothing else changes)
   ===================================================================== */
const Store = (() => {
  const KEY = "acepoint_v1"; let mem = null;
  function load(){ if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) {}
    mem = mem || {users:{}, session:null, teacherPass:null}; return mem; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} }
  return {
    getUser: email => load().users[email] || null,
    allUsers: () => Object.values(load().users),
    saveUser: u => { load().users[u.email] = u; save(); },
    session: () => load().session,
    setSession: email => { load().session = email; save(); },
    teacherPass: () => load().teacherPass,
    setTeacherPass: p => { load().teacherPass = p; save(); }
  };
})();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LEVELS = ["easy","medium","hard"], LN = {easy:"Easy",medium:"Medium",hard:"Hard"};
const me = () => { const e = Store.session(); return e ? Store.getUser(e) : null; };
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 2500); }
function chapterOf(cid, chid){ return (CHAPTERS[cid]||[]).find(c => c.id === chid); }
function attemptsFor(u, cid){ return (u.attempts||[]).filter(a => a.course === cid); }
function topicStats(attempts){
  const t = {}; attempts.forEach(a => a.answers.forEach(x => { t[x.topic] = t[x.topic] || {r:0,n:0}; t[x.topic].n++; if (x.ok) t[x.topic].r++; })); return t;
}
function strengthTag(st){
  if (!st || st.n < 10) return `<span class="tag na">${st ? 10 - st.n : 10} more to unlock</span>`;
  const p = st.r/st.n; return p >= .75 ? '<span class="tag ok">Strong</span>' : p >= .5 ? '<span class="tag mid">Okay</span>' : '<span class="tag weak">Needs work</span>';
}
function quickTag(r,n){ const p = n ? r/n : 0; return p >= .75 ? '<span class="tag ok">Strong</span>' : p >= .5 ? '<span class="tag mid">Okay</span>' : '<span class="tag weak">Needs work</span>'; }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + ", " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }

let VIEW = {name:"welcome"};
function go(name, params={}){
  if (Q && Q.active && name !== "report") return;
  VIEW = {name, ...params}; render(); window.scrollTo(0,0);
}
function header(){
  const u = me(); const h = $("hdrRight");
  if (u && VIEW.name !== "quiz") h.innerHTML = `<span>Hi, ${esc(u.name.split(" ")[0])}</span><button id="logoutBtn">Log out</button>`;
  else h.innerHTML = "";
  const lb = $("logoutBtn"); if (lb) lb.onclick = () => { Store.setSession(null); go("welcome"); };
  $("foot").style.display = VIEW.name === "quiz" ? "none" : "";
}
function render(){
  header(); const app = $("app");
  const V = Views[VIEW.name] || Views.welcome; app.innerHTML = V(); if (V.after) V.after();
}

/* =====================================================================
   5. QUIZ ENGINE
   ===================================================================== */
const SECONDS = 45, MAX_WARN = 3, UP_AFTER = 3, DOWN_AFTER = 2, MAX_Q = 10;
const CHEERS = [["🎯","Bullseye!","Spot on."],["🚀","Nailed it!","Keep going."],["🧪","Chemistry champ!","That's correct."],["😎","Too easy for you!","Correct answer."],
  ["⚗️","Perfect reaction!","Right answer."],["⭐","Superstar!","Correct."],["🙌","Yes!","Well done."],["🧠","Big brain!","Correct."]];
const LEVELUP = ["🏆","Level up!","Questions get harder now."];
const OOPS = [["🤏","Almost!","Read the explanation below."],["💪","No worries!","Check what went wrong below."],["🧐","Not quite!","Let's see why."]];
let Q = null;

async function startQuiz(cid, chid, topic){
  const ch = chapterOf(cid, chid); const pool = ch.qs.filter(q => !topic || q.topic === topic);
  Q = {cid, chid, topic, pool, total:Math.min(MAX_Q, pool.length), level:0, maxLevel:0, rs:0, ws:0, asked:[], used:new Set(),
       warnings:0, incidents:[], cur:null, timerId:null, left:0, limit:0, answered:false, active:true,
       ts:Date.now(), lastInc:0, grace:Date.now()+2000, baseW:window.innerWidth};
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e) {}
  Q.baseW = window.innerWidth; Q.grace = Date.now() + 1500;
  VIEW = {name:"quiz"}; header(); $("app").innerHTML = quizShell(); $("app").classList.add("quizmode");
  $("nextBtn").onclick = nextQ; $("quitBtn").onclick = () => $("confirm").classList.add("show");
  nextQ();
}
function quizShell(){ const ch = chapterOf(Q.cid,Q.chid); return `
  <div class="card">
    <div class="muted small" style="margin-bottom:8px">${esc(ch.name)}${Q.topic?" · "+esc(Q.topic):""}</div>
    <div class="bar"><span id="qnum" class="pill"></span><span id="lvl" class="pill easy">Easy</span><span id="streak" class="pill">Streak: 0</span><span id="warnPill" class="pill warn" style="display:none"></span></div>
    <div id="timer" class="timer"><div></div></div><div id="timeLeft" class="muted small" style="margin-bottom:8px"></div>
    <div id="topic" class="muted small"></div><div id="qtext" class="qtext"></div><div id="opts"></div><div id="feedback"></div>
    <div class="row" style="justify-content:space-between"><button class="link" id="quitBtn">End quiz</button><button id="nextBtn" class="btn" style="display:none">Next question</button></div>
  </div>`; }
function pickQ(){
  const order = [Q.level, Q.level+1, Q.level-1, Q.level+2, Q.level-2].filter(l => l>=0 && l<3);
  for (const l of order){ const p = Q.pool.filter(q => q.level === LEVELS[l] && !Q.used.has(q.id)); if (p.length) return p[Math.floor(Math.random()*p.length)]; }
  return null;
}
function nextQ(){
  if (Q.asked.length >= Q.total) return finishQuiz(false);
  const q = pickQ(); if (!q) return finishQuiz(false);
  Q.used.add(q.id); Q.cur = q; Q.answered = false;
  $("qnum").textContent = `Question ${Q.asked.length+1} of ${Q.total}`;
  $("lvl").textContent = LN[q.level]; $("lvl").className = "pill " + q.level;
  $("streak").textContent = `Streak: ${Q.rs}`;
  $("topic").textContent = "Topic: " + q.topic + (q.time ? " · Calculation: 1 minute" : "");
  $("qtext").textContent = q.q; $("feedback").innerHTML = ""; $("nextBtn").style.display = "none";
  const box = $("opts"); box.innerHTML = "";
  q.options.forEach((o,i) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = `<b>${"ABCD"[i]}</b>`; b.appendChild(document.createTextNode(o)); b.onclick = () => answerQ(i); box.appendChild(b); });
  clearInterval(Q.timerId); Q.limit = q.time || SECONDS; Q.left = Q.limit; drawTimer();
  Q.timerId = setInterval(() => { Q.left--; drawTimer(); if (Q.left <= 0){ clearInterval(Q.timerId); answerQ(-1); } }, 1000);
  window.scrollTo(0,0);
}
function drawTimer(){ $("timer").firstElementChild.style.width = (Math.max(Q.left,0)/Q.limit*100) + "%"; $("timer").classList.toggle("low", Q.left <= 10); $("timeLeft").textContent = `${Math.max(Q.left,0)} s left`; }
function answerQ(i){
  if (Q.answered || !Q.active) return; Q.answered = true; clearInterval(Q.timerId);
  const q = Q.cur, ok = i === q.answer;
  document.querySelectorAll(".opt").forEach((b,k) => { b.disabled = true; if (k===q.answer) b.classList.add("correct"); if (k===i && !ok) b.classList.add("wrong"); });
  Q.asked.push({id:q.id, topic:q.topic, level:q.level, chosen:i, ok, secs:Q.limit - Q.left});
  let msg = "", up = false;
  if (ok){ Q.rs++; Q.ws = 0; } else { Q.ws++; Q.rs = 0; }
  if (Q.rs >= UP_AFTER && Q.level < 2){ Q.level++; Q.rs = 0; up = true; msg = `Level up! Next questions are ${LN[LEVELS[Q.level]]}.`; }
  if (Q.ws >= DOWN_AFTER && Q.level > 0){ Q.level--; Q.ws = 0; msg = `Let's step back to ${LN[LEVELS[Q.level]]} questions to build up again.`; }
  Q.maxLevel = Math.max(Q.maxLevel, Q.level); $("streak").textContent = `Streak: ${Q.rs}`;
  $("feedback").innerHTML = ok
    ? `<div class="feedback good"><h3>✅ Correct!</h3><p>${esc(q.explain)}</p>${msg?`<p><b>${msg}</b></p>`:""}</div>`
    : `<div class="feedback bad"><h3>${i===-1?"⏰ Time's up!":"❌ Not quite."}</h3><p><b>Correct answer: ${"ABCD"[q.answer]}) ${esc(q.options[q.answer])}</b></p><p>${esc(q.explain)}</p>
       <div class="mist"><b>Where it went wrong:</b> ${i===-1?"You ran out of time on this one.":esc(q.mistakes[i]||"")}</div>${msg?`<p><b>${msg}</b></p>`:""}</div>`;
  $("nextBtn").textContent = Q.asked.length >= Q.total ? "See my report" : "Next question"; $("nextBtn").style.display = "";
  if (ok) celebrate(up ? LEVELUP : CHEERS[Math.floor(Math.random()*CHEERS.length)], up);
  else if (i !== -1) celebrate(OOPS[Math.floor(Math.random()*OOPS.length)], false);
}
function celebrate(c, confetti){
  const el = $("cheer"); el.querySelector(".emo").textContent = c[0]; el.querySelector(".msg").textContent = c[1]; el.querySelector(".sm").textContent = c[2];
  el.classList.add("show"); if (confetti) burst();
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), confetti ? 5000 : 4000);
}
function burst(){ const col = ["#ffcc33","#1f5fbf","#16834a","#c0392b","#8e44ad","#f39c12"];
  for (let k=0;k<60;k++){ const d = document.createElement("div"); d.className = "confetti"; d.style.left = Math.random()*100+"vw"; d.style.background = col[k%col.length];
    d.style.animationDelay = (Math.random()*1.5)+"s"; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); } }
$("cheer").onclick = () => $("cheer").classList.remove("show");

/* ---------- Anti-cheat ---------- */
function incident(reason){
  if (!Q || !Q.active) return; const now = Date.now();
  if (now < Q.grace || now - Q.lastInc < 2500 || $("confirm").classList.contains("show")) return;
  Q.lastInc = now; Q.warnings++;
  Q.incidents.push({time:new Date().toLocaleTimeString(), reason, q:Q.asked.length + (Q.answered?0:1)});
  $("warnPill").style.display = ""; $("warnPill").textContent = `Warnings: ${Q.warnings}/${MAX_WARN}`;
  if (Q.warnings >= MAX_WARN){ $("warn").classList.remove("show"); return finishQuiz(true); }
  $("warnCount").textContent = Q.warnings; $("warnText").textContent = reason + "."; $("warn").classList.add("show");
}
document.addEventListener("visibilitychange", () => { if (document.hidden) incident("You switched to another tab or app"); });
window.addEventListener("blur", () => incident("You clicked outside the quiz window"));
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && Q && Q.active && Date.now() > Q.grace) incident("You left fullscreen"); });
window.addEventListener("resize", () => { if (!Q || !Q.active) return; if (window.innerWidth < Q.baseW * 0.6) incident("The window was shrunk or split screen was used"); Q.baseW = Math.max(Q.baseW, window.innerWidth); });
document.addEventListener("copy", e => { if (Q && Q.active) e.preventDefault(); });
document.addEventListener("contextmenu", e => { if (Q && Q.active) e.preventDefault(); });
$("warnBtn").onclick = async () => { $("warn").classList.remove("show"); Q.grace = Date.now() + 1500;
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e) {} };
$("confNo").onclick = () => { $("confirm").classList.remove("show"); if (Q) Q.grace = Date.now() + 1000; };
$("confYes").onclick = () => { $("confirm").classList.remove("show"); finishQuiz(false, true); };

/* ---------- Finish + save ---------- */
function finishQuiz(auto, quit){
  Q.active = false; clearInterval(Q.timerId); $("cheer").classList.remove("show"); $("app").classList.remove("quizmode");
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
  const right = Q.asked.filter(a => a.ok).length;
  const att = {id:"q"+Date.now(), course:Q.cid, chapter:Q.chid, topic:Q.topic||null, ts:Q.ts, right, total:Q.asked.length,
               maxLevel:LEVELS[Q.maxLevel], auto, quit:!!quit, answers:Q.asked, incidents:Q.incidents};
  const u = me(); if (u){ u.attempts = u.attempts || []; if (att.total) u.attempts.push(att); Store.saveUser(u); }
  VIEW = {name:"report", att}; render(); window.scrollTo(0,0);
}
function reportHTML(att, forTeacher){
  const ch = chapterOf(att.course, att.chapter); const byId = id => ch.qs.find(q => q.id === id);
  const pct = att.total ? Math.round(att.right/att.total*100) : 0;
  const t = {}; att.answers.forEach(a => { t[a.topic] = t[a.topic]||{r:0,n:0}; t[a.topic].n++; if (a.ok) t[a.topic].r++; });
  const wrong = att.answers.filter(a => !a.ok).map(a => { const q = byId(a.id); return `
    <div class="review"><div class="q">${esc(q.q)}</div>
    <div>${forTeacher?"Answer given":"Your answer"}: ${a.chosen===-1?"<i>No answer (time ran out)</i>":"ABCD"[a.chosen]+") "+esc(q.options[a.chosen])}</div>
    <div><b>Correct: ${"ABCD"[q.answer]}) ${esc(q.options[q.answer])}</b></div>
    ${a.chosen!==-1?`<div class="muted small" style="margin-top:4px">Where it went wrong: ${esc(q.mistakes[a.chosen])}</div>`:""}
    <div class="muted small" style="margin-top:4px">${esc(q.explain)}</div></div>`; }).join("");
  return `
    <div class="big">${att.right} / ${att.total}</div>
    <p class="muted">${pct}% correct · Highest level: <b>${LN[att.maxLevel]}</b> · ${fmtDate(att.ts)}</p>
    ${att.auto?`<p style="color:var(--red);font-weight:600">Submitted automatically after ${MAX_WARN} warnings.</p>`:""}
    ${att.quit?`<p class="muted">Quiz ended early.</p>`:""}
    <h2>By topic</h2><table><tr><th>Topic</th><th>Score</th><th></th></tr>${Object.entries(t).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v.r}/${v.n}</td><td>${quickTag(v.r,v.n)}</td></tr>`).join("")}</table>
    <h2>By level</h2><table><tr><th>Level</th><th>Score</th></tr>${LEVELS.map(l => { const a = att.answers.filter(x=>x.level===l); return a.length?`<tr><td>${LN[l]}</td><td>${a.filter(x=>x.ok).length}/${a.length}</td></tr>`:""; }).join("")}</table>
    <h2>Questions to review</h2>${wrong || '<p class="muted">Every question right! 🏆</p>'}
    <h2>Focus log</h2>${att.incidents.length ? `<table><tr><th>Time</th><th>Q</th><th>What happened</th></tr>${att.incidents.map(x => `<tr><td>${x.time}</td><td>${x.q}</td><td>${esc(x.reason)}</td></tr>`).join("")}</table>` : '<p class="muted">No warnings. Great focus!</p>'}`;
}
Views.report = () => { const a = VIEW.att, u = me(); const pct = a.total ? a.right/a.total : 0;
  return `<div class="card"><h1>${pct>=.8?"🏆":pct>=.5?"👍":"📚"} Well done, ${esc(u?u.name.split(" ")[0]:"")}!</h1>
    <p class="muted small">Saved to your history.</p>${a.total?reportHTML(a,false):'<p class="muted">No questions were answered.</p>'}
    <div class="row" style="justify-content:flex-start"><button class="btn" id="again">Practise again</button><button class="btn ghost" id="share">Copy result for teacher</button><button class="btn ghost" id="toCourse">Back to course</button></div></div>`; };
Views.report.after = () => { const a = VIEW.att;
  $("again").onclick = () => go("chapter",{cid:a.course, chid:a.chapter});
  $("toCourse").onclick = () => go("course",{cid:a.course, tab:"practice"});
  $("share").onclick = async () => { const u = me(); const ch = chapterOf(a.course,a.chapter);
    const txt = `ACE POINT result\n${u.name} (${u.email})\n${COURSE[a.course].name} · ${ch.name}\nScore: ${a.right}/${a.total} · Highest level: ${LN[a.maxLevel]}\nWarnings: ${a.incidents.length}${a.auto?" (auto-submitted)":""}\n${fmtDate(a.ts)}`;
    try { await navigator.clipboard.writeText(txt); toast("Copied! Paste it on WhatsApp to your teacher."); } catch(e) { toast("Couldn't copy on this device."); } };
};

/* =====================================================================
   6. TEACHER DASHBOARD
   ===================================================================== */
let TEACHER = false;
Views.teacherLock = () => { const set = !Store.teacherPass(); return `
  <button class="back" id="bk">← Back</button>
  <div class="card"><h1>Teacher login</h1>
    <p class="muted">${set ? "First time here: create a teacher passcode." : "Enter your teacher passcode."}</p>
    <label for="tp">Passcode</label><input id="tp" type="password" autocomplete="off">
    ${set ? '<label for="tp2">Confirm passcode</label><input id="tp2" type="password" autocomplete="off">' : ""}
    <div class="err" id="tp_err"></div><button class="btn block" id="tp_go">${set ? "Set passcode" : "Open dashboard"}</button></div>`; };
Views.teacherLock.after = () => {
  $("bk").onclick = () => go(me() ? "home" : "welcome");
  $("tp_go").onclick = () => { const p = $("tp").value;
    if (!Store.teacherPass()){ if (p.length < 4) return $("tp_err").textContent = "Use at least 4 characters."; if (p !== $("tp2").value) return $("tp_err").textContent = "The passcodes don't match."; Store.setTeacherPass(p); }
    else if (p !== Store.teacherPass()) return $("tp_err").textContent = "Wrong passcode.";
    TEACHER = true; go("teacher"); };
};
Views.teacher = () => { if (!TEACHER) return Views.teacherLock();
  const us = Store.allUsers(); const at = us.flatMap(u => (u.attempts||[]));
  return `
  <button class="back" id="bk">← Leave dashboard</button>
  <div class="card"><h1>Teacher dashboard</h1>
    <div class="stat"><div><b>${us.length}</b><span>Students</span></div><div><b>${at.length}</b><span>Quizzes</span></div><div><b>${at.reduce((s,a)=>s+a.incidents.length,0)}</b><span>Warnings</span></div></div>
    <div class="note">This shows students who used the app on this device. Once the online database is connected, every student will show here from any device.</div></div>
  <h2>Students</h2>
  <div class="grid">${us.map(u => { const a = u.attempts||[]; const r = a.reduce((s,x)=>s+x.right,0), n = a.reduce((s,x)=>s+x.total,0);
    return `<button class="tile" data-u="${esc(u.email)}"><div class="t">${esc(u.name)} <span class="badge own">${esc(u.cls||"")}</span></div>
      <div class="d">${esc(u.email)} · ${esc(u.phone)}</div><div class="d">${a.length} quiz(zes) · ${n?Math.round(r/n*100):0}% accuracy · ${u.courses.map(c=>esc(COURSE[c]?.name||c)).join(", ")||"No course"}</div></button>`; }).join("") || '<p class="muted">No students yet.</p>'}</div>
  <h2>Question bank</h2>
  <div class="card"><table><tr><th>Course</th><th>Chapter</th><th>Easy</th><th>Medium</th><th>Hard</th></tr>
  ${Object.entries(CHAPTERS).flatMap(([cid,chs]) => chs.map(ch => `<tr><td>${esc(COURSE[cid].name)}</td><td>${esc(ch.name)}</td>${LEVELS.map(l=>`<td>${ch.qs.filter(q=>q.level===l).length}</td>`).join("")}</tr>`)).join("")}</table></div>`; };
Views.teacher.after = () => { $("bk").onclick = () => { TEACHER = false; go(me() ? "home" : "welcome"); };
  document.querySelectorAll(".tile[data-u]").forEach(t => t.onclick = () => go("tStudent",{email:t.dataset.u})); };
Views.tStudent = () => { if (!TEACHER) return Views.teacherLock(); const u = Store.getUser(VIEW.email); const a = u.attempts||[];
  const byCourse = u.courses.map(cid => { const ts = topicStats(a.filter(x=>x.course===cid)); const topics = [...new Set((CHAPTERS[cid]||[]).flatMap(c=>c.topics))];
    return `<h2>${esc(COURSE[cid].name)}</h2><table><tr><th>Topic</th><th>Answered</th><th>Correct</th><th></th></tr>${topics.map(t => { const s = ts[t];
      return `<tr><td>${esc(t)}</td><td>${s?s.n:0}</td><td>${s?Math.round(s.r/s.n*100)+"%":"–"}</td><td>${s?quickTag(s.r,s.n):'<span class="tag na">Not started</span>'}</td></tr>`; }).join("")}</table>`; }).join("");
  return `<button class="back" id="bk">← Dashboard</button>
  <div class="card"><h1>${esc(u.name)}</h1><p class="muted">${esc(u.cls||"")} · ${esc(u.email)} · ${esc(u.phone)}</p>${byCourse}</div>
  <h2>Quizzes</h2>${a.length ? a.slice().reverse().map((x,i) => `<button class="tile" data-i="${a.length-1-i}" style="margin-bottom:8px">
    <div class="t">${x.right}/${x.total} · ${esc(chapterOf(x.course,x.chapter)?.name||"")}${x.incidents.length?` <span class="badge" style="background:var(--redbg);color:var(--red)">${x.incidents.length} warning(s)</span>`:""}</div>
    <div class="d">${fmtDate(x.ts)} · Highest level ${LN[x.maxLevel]}${x.auto?" · Auto-submitted":""}</div></button>`).join("") : '<p class="muted">No quizzes yet.</p>'}`; };
Views.tStudent.after = () => { $("bk").onclick = () => go("teacher");
  document.querySelectorAll(".tile[data-i]").forEach(t => t.onclick = () => go("tAttempt",{email:VIEW.email, i:+t.dataset.i})); };
Views.tAttempt = () => { if (!TEACHER) return Views.teacherLock(); const u = Store.getUser(VIEW.email); const at = u.attempts[VIEW.i];
  return `<button class="back" id="bk">← ${esc(u.name)}</button><div class="card"><h1>${esc(u.name)}'s quiz</h1><p class="muted">${esc(chapterOf(at.course,at.chapter).name)}</p>${reportHTML(at,true)}</div>`; };
Views.tAttempt.after = () => { $("bk").onclick = () => go("tStudent",{email:VIEW.email}); };

/* ---------- Boot ---------- */
go(me() ? "home" : "welcome");
</script>
</body>
</html>
